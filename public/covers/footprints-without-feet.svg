<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_footprints-without-feet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="60%" stop-color="#9F1239" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>
    <pattern id="grid_footprints-without-feet" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.8"/>
    </pattern>
  </defs>
  <!-- Background with subtle textured grid -->
  <rect width="400" height="580" rx="14" fill="url(#grad_footprints-without-feet)"/>
  <rect width="400" height="580" rx="14" fill="url(#grid_footprints-without-feet)"/>

  <!-- Top bar header -->
  <rect x="25" y="24" width="350" height="34" rx="6" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="40" y="46" font-family="Ubuntu, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FDA4AF" letter-spacing="1.5">NCERT • CLASS X</text>
  <rect x="305" y="30" width="60" height="22" rx="4" fill="#FDA4AF"/>
  <text x="335" y="45" font-family="Ubuntu, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#1C1C1E" text-anchor="middle">SUPPLEMENTARY</text>

  <!-- Central Artwork Motif -->
  <g>
    
      <!-- Footstep footprints trail -->
      <ellipse cx="170" cy="250" rx="14" ry="24" fill="rgba(253, 164, 175, 0.7)" transform="rotate(-15 170 250)"/>
      <circle cx="163" cy="220" r="4" fill="#FDA4AF"/>
      <circle cx="170" cy="218" r="4.5" fill="#FDA4AF"/>
      <circle cx="178" cy="221" r="4" fill="#FDA4AF"/>

      <ellipse cx="230" cy="310" rx="14" ry="24" fill="rgba(253, 164, 175, 0.7)" transform="rotate(15 230 310)"/>
      <circle cx="237" cy="280" r="4" fill="#FDA4AF"/>
      <circle cx="230" cy="278" r="4.5" fill="#FDA4AF"/>
      <circle cx="222" cy="281" r="4" fill="#FDA4AF"/>
    
  </g>

  <!-- Bottom Title Card with Ubuntu styling -->
  <rect x="24" y="470" width="352" height="86" rx="10" fill="rgba(18, 18, 20, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="40" y="504" font-family="Ubuntu, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">FOOTPRINTS WITHOUT FEET</text>
  <text x="40" y="528" font-family="Ubuntu, -apple-system, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.7)">Supplementary Reader for Class X</text>
  <line x1="40" y1="540" x2="140" y2="540" stroke="#FDA4AF" stroke-width="2.5" stroke-linecap="round"/>
</svg>