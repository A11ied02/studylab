<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_geography" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="60%" stop-color="#115E59" />
      <stop offset="100%" stop-color="#134E4A" />
    </linearGradient>
    <pattern id="grid_geography" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.8"/>
    </pattern>
  </defs>
  <!-- Background with subtle textured grid -->
  <rect width="400" height="580" rx="14" fill="url(#grad_geography)"/>
  <rect width="400" height="580" rx="14" fill="url(#grid_geography)"/>

  <!-- Top bar header -->
  <rect x="25" y="24" width="350" height="34" rx="6" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="40" y="46" font-family="Ubuntu, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2DD4BF" letter-spacing="1.5">NCERT • CLASS X</text>
  <rect x="305" y="30" width="60" height="22" rx="4" fill="#2DD4BF"/>
  <text x="335" y="45" font-family="Ubuntu, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#1C1C1E" text-anchor="middle">GEOGRAPHY</text>

  <!-- Central Artwork Motif -->
  <g>
    
      <!-- Earth &amp; Topography lines -->
      <circle cx="200" cy="280" r="75" stroke="#2DD4BF" stroke-width="2.5" fill="rgba(45, 212, 191, 0.1)"/>
      <path d="M130 270 Q160 250 190 280 T260 260" stroke="#2DD4BF" stroke-width="2" fill="none"/>
      <path d="M140 295 Q170 275 210 300 T270 285" stroke="#2DD4BF" stroke-width="1.5" fill="none"/>
      <path d="M150 320 Q180 300 220 325 T265 315" stroke="rgba(45, 212, 191, 0.6)" stroke-width="1.5" fill="none"/>
      <!-- Mountain ridges -->
      <polygon points="150,450 185,410 220,450" fill="rgba(45, 212, 191, 0.25)" stroke="#2DD4BF" stroke-width="1.5"/>
      <polygon points="195,450 230,395 265,450" fill="rgba(45, 212, 191, 0.4)" stroke="#2DD4BF" stroke-width="1.5"/>
    
  </g>

  <!-- Bottom Title Card with Ubuntu styling -->
  <rect x="24" y="470" width="352" height="86" rx="10" fill="rgba(18, 18, 20, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="40" y="504" font-family="Ubuntu, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">CONTEMPORARY INDIA II</text>
  <text x="40" y="528" font-family="Ubuntu, -apple-system, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.7)">Geography Textbook for Class X</text>
  <line x1="40" y1="540" x2="140" y2="540" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round"/>
</svg>