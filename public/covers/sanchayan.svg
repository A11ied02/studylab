<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_sanchayan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854D0E" />
      <stop offset="60%" stop-color="#A16207" />
      <stop offset="100%" stop-color="#713F12" />
    </linearGradient>
    <pattern id="grid_sanchayan" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.8"/>
    </pattern>
  </defs>
  <!-- Background with subtle textured grid -->
  <rect width="400" height="580" rx="14" fill="url(#grad_sanchayan)"/>
  <rect width="400" height="580" rx="14" fill="url(#grid_sanchayan)"/>

  <!-- Top bar header -->
  <rect x="25" y="24" width="350" height="34" rx="6" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="40" y="46" font-family="Ubuntu, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FDE047" letter-spacing="1.5">NCERT • CLASS X</text>
  <rect x="305" y="30" width="60" height="22" rx="4" fill="#FDE047"/>
  <text x="335" y="45" font-family="Ubuntu, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#1C1C1E" text-anchor="middle">पूरक पुस्तक</text>

  <!-- Central Artwork Motif -->
  <g>
    
      <!-- Traditional manuscript scroll -->
      <rect x="150" y="240" width="100" height="90" rx="8" fill="rgba(253, 224, 71, 0.15)" stroke="#FDE047" stroke-width="2"/>
      <line x1="165" y1="265" x2="235" y2="265" stroke="#FDE047" stroke-width="1.5"/>
      <line x1="165" y1="285" x2="235" y2="285" stroke="#FDE047" stroke-width="1.5"/>
      <line x1="165" y1="305" x2="210" y2="305" stroke="#FDE047" stroke-width="1.5"/>
    
  </g>

  <!-- Bottom Title Card with Ubuntu styling -->
  <rect x="24" y="470" width="352" height="86" rx="10" fill="rgba(18, 18, 20, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="40" y="504" font-family="Ubuntu, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">संचयन (भाग २)</text>
  <text x="40" y="528" font-family="Ubuntu, -apple-system, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.7)">पूरक पाठ्यपुस्तक कक्षा १०</text>
  <line x1="40" y1="540" x2="140" y2="540" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round"/>
</svg>