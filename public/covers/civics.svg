<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_civics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <pattern id="grid_civics" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.8"/>
    </pattern>
  </defs>
  <!-- Background with subtle textured grid -->
  <rect width="400" height="580" rx="14" fill="url(#grad_civics)"/>
  <rect width="400" height="580" rx="14" fill="url(#grid_civics)"/>

  <!-- Top bar header -->
  <rect x="25" y="24" width="350" height="34" rx="6" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="40" y="46" font-family="Ubuntu, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" letter-spacing="1.5">NCERT • CLASS X</text>
  <rect x="305" y="30" width="60" height="22" rx="4" fill="#60A5FA"/>
  <text x="335" y="45" font-family="Ubuntu, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#1C1C1E" text-anchor="middle">CIVICS</text>

  <!-- Central Artwork Motif -->
  <g>
    
      <!-- Parliament columns &amp; Ashoka chakra -->
      <rect x="140" y="240" width="120" height="12" rx="3" fill="#60A5FA"/>
      <rect x="145" y="320" width="110" height="10" rx="2" fill="#60A5FA"/>
      <rect x="150" y="255" width="8" height="62" fill="rgba(96, 165, 250, 0.7)"/>
      <rect x="175" y="255" width="8" height="62" fill="rgba(96, 165, 250, 0.7)"/>
      <rect x="200" y="255" width="8" height="62" fill="rgba(96, 165, 250, 0.7)"/>
      <rect x="225" y="255" width="8" height="62" fill="rgba(96, 165, 250, 0.7)"/>
      <polygon points="135,238 200,200 265,238" fill="rgba(96, 165, 250, 0.3)" stroke="#60A5FA" stroke-width="2"/>
      <circle cx="200" cy="410" r="32" stroke="#60A5FA" stroke-width="2" fill="rgba(96, 165, 250, 0.15)"/>
      <circle cx="200" cy="410" r="6" fill="#60A5FA"/>
    
  </g>

  <!-- Bottom Title Card with Ubuntu styling -->
  <rect x="24" y="470" width="352" height="86" rx="10" fill="rgba(18, 18, 20, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="40" y="504" font-family="Ubuntu, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">DEMOCRATIC POLITICS II</text>
  <text x="40" y="528" font-family="Ubuntu, -apple-system, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.7)">Political Science Textbook for Class X</text>
  <line x1="40" y1="540" x2="140" y2="540" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
</svg>