<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_hindi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="60%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>
    <pattern id="grid_hindi" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.8"/>
    </pattern>
  </defs>
  <!-- Background with subtle textured grid -->
  <rect width="400" height="580" rx="14" fill="url(#grad_hindi)"/>
  <rect width="400" height="580" rx="14" fill="url(#grid_hindi)"/>

  <!-- Top bar header -->
  <rect x="25" y="24" width="350" height="34" rx="6" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="40" y="46" font-family="Ubuntu, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#D8B4FE" letter-spacing="1.5">NCERT • CLASS X</text>
  <rect x="305" y="30" width="60" height="22" rx="4" fill="#D8B4FE"/>
  <text x="335" y="45" font-family="Ubuntu, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#1C1C1E" text-anchor="middle">कक्षा १०</text>

  <!-- Central Artwork Motif -->
  <g>
    
      <!-- Devanagari calligraphy art -->
      <text x="200" y="290" text-anchor="middle" font-family="Ubuntu, sans-serif" font-size="72" font-weight="700" fill="#D8B4FE">अ</text>
      <circle cx="200" cy="270" r="70" stroke="rgba(216, 180, 254, 0.3)" stroke-width="2" stroke-dasharray="6 6"/>
      <path d="M140 400 Q200 380 260 400" stroke="#D8B4FE" stroke-width="2" fill="none"/>
      <text x="200" y="440" text-anchor="middle" font-family="Ubuntu, sans-serif" font-size="18" font-weight="600" fill="#E9D5FF">साहित्य एवं भाषा</text>
    
  </g>

  <!-- Bottom Title Card with Ubuntu styling -->
  <rect x="24" y="470" width="352" height="86" rx="10" fill="rgba(18, 18, 20, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="40" y="504" font-family="Ubuntu, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">हिंदी (HINDI)</text>
  <text x="40" y="528" font-family="Ubuntu, -apple-system, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.7)">स्पर्श एवं संचयन भाग २</text>
  <line x1="40" y1="540" x2="140" y2="540" stroke="#D8B4FE" stroke-width="2.5" stroke-linecap="round"/>
</svg>