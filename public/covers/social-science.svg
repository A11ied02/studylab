<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_social-science" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="60%" stop-color="#701A75" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>
    <pattern id="grid_social-science" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.8"/>
    </pattern>
  </defs>
  <!-- Background with subtle textured grid -->
  <rect width="400" height="580" rx="14" fill="url(#grad_social-science)"/>
  <rect width="400" height="580" rx="14" fill="url(#grid_social-science)"/>

  <!-- Top bar header -->
  <rect x="25" y="24" width="350" height="34" rx="6" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="40" y="46" font-family="Ubuntu, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#F472B6" letter-spacing="1.5">NCERT • CLASS X</text>
  <rect x="305" y="30" width="60" height="22" rx="4" fill="#F472B6"/>
  <text x="335" y="45" font-family="Ubuntu, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#1C1C1E" text-anchor="middle">CLASS X</text>

  <!-- Central Artwork Motif -->
  <g>
    
      <!-- Ashoka Emblem &amp; Globe contour -->
      <circle cx="200" cy="270" r="70" stroke="#F472B6" stroke-width="2" fill="none"/>
      <ellipse cx="200" cy="270" rx="70" ry="25" stroke="rgba(244, 114, 182, 0.5)" stroke-width="1.5" fill="none"/>
      <ellipse cx="200" cy="270" rx="25" ry="70" stroke="rgba(244, 114, 182, 0.5)" stroke-width="1.5" fill="none"/>
      <line x1="200" y1="190" x2="200" y2="350" stroke="#F472B6" stroke-width="1.5"/>
      <line x1="120" y1="270" x2="280" y2="270" stroke="#F472B6" stroke-width="1.5"/>
      <circle cx="200" cy="420" r="30" stroke="#F472B6" stroke-width="2" fill="rgba(244, 114, 182, 0.1)"/>
      <!-- Compass needle -->
      <polygon points="200,395 208,420 200,415 192,420" fill="#F472B6"/>
      <polygon points="200,445 208,420 200,425 192,420" fill="rgba(244, 114, 182, 0.4)"/>
    
  </g>

  <!-- Bottom Title Card with Ubuntu styling -->
  <rect x="24" y="470" width="352" height="86" rx="10" fill="rgba(18, 18, 20, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="40" y="504" font-family="Ubuntu, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">SOCIAL SCIENCE</text>
  <text x="40" y="528" font-family="Ubuntu, -apple-system, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.7)">Democratic Life, History, Geography &amp; Economics</text>
  <line x1="40" y1="540" x2="140" y2="540" stroke="#F472B6" stroke-width="2.5" stroke-linecap="round"/>
</svg>