<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_first-flight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <pattern id="grid_first-flight" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.8"/>
    </pattern>
  </defs>
  <!-- Background with subtle textured grid -->
  <rect width="400" height="580" rx="14" fill="url(#grad_first-flight)"/>
  <rect width="400" height="580" rx="14" fill="url(#grid_first-flight)"/>

  <!-- Top bar header -->
  <rect x="25" y="24" width="350" height="34" rx="6" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="40" y="46" font-family="Ubuntu, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#93C5FD" letter-spacing="1.5">NCERT • CLASS X</text>
  <rect x="305" y="30" width="60" height="22" rx="4" fill="#93C5FD"/>
  <text x="335" y="45" font-family="Ubuntu, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#1C1C1E" text-anchor="middle">READER</text>

  <!-- Central Artwork Motif -->
  <g>
    
      <!-- Soaring seagull across the sun -->
      <circle cx="200" cy="270" r="55" fill="rgba(255, 255, 255, 0.15)"/>
      <path d="M150 260 Q185 220 205 250 Q225 220 260 260 Q220 255 205 275 Q190 255 150 260 Z" fill="#93C5FD"/>
      <!-- Sun rays -->
      <line x1="200" y1="195" x2="200" y2="205" stroke="#93C5FD" stroke-width="2"/>
      <line x1="255" y1="215" x2="247" y2="223" stroke="#93C5FD" stroke-width="2"/>
      <line x1="145" y1="215" x2="153" y2="223" stroke="#93C5FD" stroke-width="2"/>
    
  </g>

  <!-- Bottom Title Card with Ubuntu styling -->
  <rect x="24" y="470" width="352" height="86" rx="10" fill="rgba(18, 18, 20, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="40" y="504" font-family="Ubuntu, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">FIRST FLIGHT</text>
  <text x="40" y="528" font-family="Ubuntu, -apple-system, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.7)">Main Literature Reader for Class X</text>
  <line x1="40" y1="540" x2="140" y2="540" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round"/>
</svg>