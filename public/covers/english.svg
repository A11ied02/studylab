<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_english" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="60%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <pattern id="grid_english" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.8"/>
    </pattern>
  </defs>
  <!-- Background with subtle textured grid -->
  <rect width="400" height="580" rx="14" fill="url(#grad_english)"/>
  <rect width="400" height="580" rx="14" fill="url(#grid_english)"/>

  <!-- Top bar header -->
  <rect x="25" y="24" width="350" height="34" rx="6" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="40" y="46" font-family="Ubuntu, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#818CF8" letter-spacing="1.5">NCERT • CLASS X</text>
  <rect x="305" y="30" width="60" height="22" rx="4" fill="#818CF8"/>
  <text x="335" y="45" font-family="Ubuntu, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#1C1C1E" text-anchor="middle">CLASS X</text>

  <!-- Central Artwork Motif -->
  <g>
    
      <!-- Open book / quill motif -->
      <path d="M140 270 Q200 250 200 300 Q200 250 260 270 L260 340 Q200 320 200 370 Q200 320 140 340 Z" fill="rgba(129, 140, 248, 0.2)" stroke="#818CF8" stroke-width="2.5"/>
      <line x1="200" y1="300" x2="200" y2="370" stroke="#818CF8" stroke-width="2"/>
      <!-- Soaring bird silhouette -->
      <path d="M170 410 Q200 380 215 400 Q230 380 260 410 Q225 410 215 425 Q205 410 170 410 Z" fill="#818CF8"/>
    
  </g>

  <!-- Bottom Title Card with Ubuntu styling -->
  <rect x="24" y="470" width="352" height="86" rx="10" fill="rgba(18, 18, 20, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="40" y="504" font-family="Ubuntu, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">ENGLISH LANGUAGE &amp; LITERATURE</text>
  <text x="40" y="528" font-family="Ubuntu, -apple-system, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.7)">First Flight &amp; Footprints Without Feet</text>
  <line x1="40" y1="540" x2="140" y2="540" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
</svg>