<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_history" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="60%" stop-color="#602B0B" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <pattern id="grid_history" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.8"/>
    </pattern>
  </defs>
  <!-- Background with subtle textured grid -->
  <rect width="400" height="580" rx="14" fill="url(#grad_history)"/>
  <rect width="400" height="580" rx="14" fill="url(#grid_history)"/>

  <!-- Top bar header -->
  <rect x="25" y="24" width="350" height="34" rx="6" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="40" y="46" font-family="Ubuntu, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" letter-spacing="1.5">NCERT • CLASS X</text>
  <rect x="305" y="30" width="60" height="22" rx="4" fill="#FBBF24"/>
  <text x="335" y="45" font-family="Ubuntu, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#1C1C1E" text-anchor="middle">HISTORY</text>

  <!-- Central Artwork Motif -->
  <g>
    
      <!-- Charkha / Historic wheel motif -->
      <circle cx="200" cy="280" r="65" stroke="#FBBF24" stroke-width="2.5" fill="none"/>
      <circle cx="200" cy="280" r="14" fill="#FBBF24"/>
      <line x1="200" y1="280" x2="265" y2="280" stroke="rgba(251, 191, 36, 0.6)" stroke-width="1.5"/><line x1="200" y1="280" x2="256.29165124598853" y2="312.5" stroke="rgba(251, 191, 36, 0.6)" stroke-width="1.5"/><line x1="200" y1="280" x2="232.5" y2="336.29165124598853" stroke="rgba(251, 191, 36, 0.6)" stroke-width="1.5"/><line x1="200" y1="280" x2="200" y2="345" stroke="rgba(251, 191, 36, 0.6)" stroke-width="1.5"/><line x1="200" y1="280" x2="167.5" y2="336.29165124598853" stroke="rgba(251, 191, 36, 0.6)" stroke-width="1.5"/><line x1="200" y1="280" x2="143.70834875401147" y2="312.5" stroke="rgba(251, 191, 36, 0.6)" stroke-width="1.5"/><line x1="200" y1="280" x2="135" y2="280" stroke="rgba(251, 191, 36, 0.6)" stroke-width="1.5"/><line x1="200" y1="280" x2="143.7083487540115" y2="247.5" stroke="rgba(251, 191, 36, 0.6)" stroke-width="1.5"/><line x1="200" y1="280" x2="167.49999999999997" y2="223.7083487540115" stroke="rgba(251, 191, 36, 0.6)" stroke-width="1.5"/><line x1="200" y1="280" x2="200" y2="215" stroke="rgba(251, 191, 36, 0.6)" stroke-width="1.5"/><line x1="200" y1="280" x2="232.5" y2="223.7083487540115" stroke="rgba(251, 191, 36, 0.6)" stroke-width="1.5"/><line x1="200" y1="280" x2="256.2916512459885" y2="247.49999999999997" stroke="rgba(251, 191, 36, 0.6)" stroke-width="1.5"/>
      <path d="M140 430 Q200 400 260 430 L260 460 Q200 430 140 460 Z" fill="rgba(251, 191, 36, 0.25)" stroke="#FBBF24" stroke-width="1.5"/>
    
  </g>

  <!-- Bottom Title Card with Ubuntu styling -->
  <rect x="24" y="470" width="352" height="86" rx="10" fill="rgba(18, 18, 20, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="40" y="504" font-family="Ubuntu, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">INDIA &amp; CONTEMPORARY WORLD II</text>
  <text x="40" y="528" font-family="Ubuntu, -apple-system, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.7)">History Textbook for Class X</text>
  <line x1="40" y1="540" x2="140" y2="540" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
</svg>