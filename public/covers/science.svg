<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_science" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <pattern id="grid_science" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.8"/>
    </pattern>
  </defs>
  <!-- Background with subtle textured grid -->
  <rect width="400" height="580" rx="14" fill="url(#grad_science)"/>
  <rect width="400" height="580" rx="14" fill="url(#grid_science)"/>

  <!-- Top bar header -->
  <rect x="25" y="24" width="350" height="34" rx="6" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="40" y="46" font-family="Ubuntu, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34D399" letter-spacing="1.5">NCERT • CLASS X</text>
  <rect x="305" y="30" width="60" height="22" rx="4" fill="#34D399"/>
  <text x="335" y="45" font-family="Ubuntu, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#1C1C1E" text-anchor="middle">CLASS X</text>

  <!-- Central Artwork Motif -->
  <g>
    
      <circle cx="200" cy="270" r="80" stroke="rgba(52, 211, 153, 0.4)" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
      <circle cx="200" cy="270" r="50" stroke="rgba(52, 211, 153, 0.7)" stroke-width="2.5" fill="none"/>
      <ellipse cx="200" cy="270" rx="90" ry="35" stroke="#34D399" stroke-width="2" fill="none" transform="rotate(30 200 270)"/>
      <ellipse cx="200" cy="270" rx="90" ry="35" stroke="#34D399" stroke-width="2" fill="none" transform="rotate(-30 200 270)"/>
      <ellipse cx="200" cy="270" rx="90" ry="35" stroke="#34D399" stroke-width="2" fill="none" transform="rotate(90 200 270)"/>
      <circle cx="200" cy="270" r="14" fill="#34D399"/>
      <circle cx="200" cy="270" r="7" fill="#064E3B"/>
      <!-- Molecule / Flask node accents -->
      <path d="M160 410 L190 460 L190 510 L210 510 L210 460 L240 410 Z" fill="rgba(52, 211, 153, 0.25)" stroke="#34D399" stroke-width="2"/>
    
  </g>

  <!-- Bottom Title Card with Ubuntu styling -->
  <rect x="24" y="470" width="352" height="86" rx="10" fill="rgba(18, 18, 20, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="40" y="504" font-family="Ubuntu, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">SCIENCE</text>
  <text x="40" y="528" font-family="Ubuntu, -apple-system, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.7)">Textbook for Class X</text>
  <line x1="40" y1="540" x2="140" y2="540" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
</svg>