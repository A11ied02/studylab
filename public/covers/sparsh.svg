<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_sparsh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="60%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <pattern id="grid_sparsh" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.8"/>
    </pattern>
  </defs>
  <!-- Background with subtle textured grid -->
  <rect width="400" height="580" rx="14" fill="url(#grad_sparsh)"/>
  <rect width="400" height="580" rx="14" fill="url(#grid_sparsh)"/>

  <!-- Top bar header -->
  <rect x="25" y="24" width="350" height="34" rx="6" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="40" y="46" font-family="Ubuntu, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#A5B4FC" letter-spacing="1.5">NCERT • CLASS X</text>
  <rect x="305" y="30" width="60" height="22" rx="4" fill="#A5B4FC"/>
  <text x="335" y="45" font-family="Ubuntu, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#1C1C1E" text-anchor="middle">कोर्स बी</text>

  <!-- Central Artwork Motif -->
  <g>
    
      <!-- Feather &amp; Devanagari calligraphic swirl -->
      <path d="M220 220 Q230 280 180 340 Q170 300 200 250 Z" fill="rgba(165, 180, 252, 0.4)" stroke="#A5B4FC" stroke-width="2"/>
      <line x1="220" y1="220" x2="175" y2="350" stroke="#A5B4FC" stroke-width="2"/>
      <circle cx="200" cy="410" r="28" stroke="#A5B4FC" stroke-width="1.5" fill="none"/>
      <text x="200" y="418" text-anchor="middle" font-family="Ubuntu, sans-serif" font-size="20" font-weight="700" fill="#A5B4FC">काव्य</text>
    
  </g>

  <!-- Bottom Title Card with Ubuntu styling -->
  <rect x="24" y="470" width="352" height="86" rx="10" fill="rgba(18, 18, 20, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="40" y="504" font-family="Ubuntu, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">स्पर्श (भाग २)</text>
  <text x="40" y="528" font-family="Ubuntu, -apple-system, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.7)">द्वितीय भाषा हिंदी पाठ्यपुस्तक</text>
  <line x1="40" y1="540" x2="140" y2="540" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round"/>
</svg>